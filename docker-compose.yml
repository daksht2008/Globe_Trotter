services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - SECRET_KEY=globetrotter-super-secret-key-change-in-prod
      - JWT_SECRET_KEY=globetrotter-jwt-secret-key-change-in-prod
      - DATABASE_URI=sqlite:///instance/app.db
      - PORT=5000
    volumes:
      - ./backend:/app
      - backend-db:/app/instance
    command: python run.py

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  backend-db:
